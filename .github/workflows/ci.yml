name: CI - Monitoring Stack

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate configuration and alert flow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CI-only dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [
              Path("docker-compose.yml"),
              Path("config/prometheus.yml"),
              Path("config/prometheus/airflow_alerts.yml"),
              Path("config/prometheus/evidently_alerts.yml"),
              Path("config/alertmanager/alertmanager.yml"),
              Path("config/statsd_mapping.yml"),
          ]
          for path in paths:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print(f"YAML OK: {path}")
          PY

      - name: Compile Airflow DAG and alert receiver
        run: python -m compileall -q airflow_dags alert_receiver

      - name: Smoke test alert receiver
        run: |
          python - <<'PY'
          import http.client
          import importlib.util
          import json
          import threading
          from http.server import ThreadingHTTPServer
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "alert_receiver_main", Path("alert_receiver/main.py")
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          server = ThreadingHTTPServer(("127.0.0.1", 0), module.AlertReceiverHandler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              connection = http.client.HTTPConnection("127.0.0.1", server.server_port, timeout=3)
              payload = {
                  "status": "firing",
                  "alerts": [{
                      "status": "firing",
                      "labels": {"alertname": "AirflowTaskFailed", "severity": "critical"},
                  }],
              }
              connection.request(
                  "POST",
                  "/alerts",
                  json.dumps(payload),
                  {"Content-Type": "application/json"},
              )
              response = connection.getresponse()
              assert response.status == 200, response.read().decode()
              print("Alert receiver smoke test: PASS")
          finally:
              server.shutdown()
              server.server_close()
          PY

      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/config/prometheus:/etc/prometheus/rules:ro" \
            prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager routing
        run: |
          docker run --rm \
            --entrypoint /bin/amtool \
            -v "$PWD/config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Build service images
        run: |
          docker build --tag ml-monitoring-airflow-ci ./airflow
          docker build --tag ml-monitoring-alert-receiver-ci ./alert_receiver
